  <style>
    .info-tooltip-wrapper {
      position: relative;
      display: inline-block;
      margin-left: 6px;
    }
    .info-tooltip-trigger {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid #999;
      background: transparent;
      color: #666;
      font-size: 0.65rem;
      font-style: italic;
      line-height: 1;

      cursor: pointer;
      vertical-align: middle;
    }
    .info-tooltip-bubble {

      position: absolute;
      bottom: 130%;
      left: 0;
      width: 220px;

      color: #FCFAF0;

      line-height: 1.3;

      z-index: 10;
    }
    .info-tooltip-wrapper.open .info-tooltip-bubble {
      display: block;
    }
  </style>

  <script>
    const GITHUB_USERNAME = 'aronsonben';

    // Git Board functionality using the public GitHub Events API
    class GitBoard {
      constructor() {
        this.commits = [];
        this.calendarData = {};
        this.init();
      }

      async init() {
        await this.loadCommits();
        this.buildCalendarData();
        this.renderCalendar();
        this.displayCommits();
        this.setupInfoTooltip();
      }

      setupInfoTooltip() {
        const wrapper = document.querySelector('.info-tooltip-wrapper');
        const trigger = document.querySelector('.info-tooltip-trigger');
        if (!wrapper || !trigger) return;

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          wrapper.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
          if (!wrapper.contains(e.target)) wrapper.classList.remove('open');
        });
      }

      async loadCommits() {
        try {
          const events = await this.fetchAllEvents();
          const pushEvents = events.filter(event => event.type === 'PushEvent');

          // Group pushes by repo so each repo needs only one compare call
          // instead of one per push - avoids burning through the unauthenticated
          // rate limit (60 req/hr), which was silently dropping most commits.
          const pushesByRepo = new Map();
          pushEvents.forEach(event => {
            const repoName = event.repo.name;
            if (!pushesByRepo.has(repoName)) pushesByRepo.set(repoName, []);
            pushesByRepo.get(repoName).push(event);
          });

          const commitLists = await Promise.all(
            Array.from(pushesByRepo.entries()).map(([repoName, repoPushes]) =>
              this.fetchRepoCommits(repoName, repoPushes)
            )
          );

          this.commits = commitLists
            .flat()
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        } catch (e) {
          console.error('Error loading commits:', e);
          this.commits = [];
        }
      }

      async fetchAllEvents() {
        // GitHub retains up to ~300 public events per user (roughly the last 90 days)
        const MAX_PAGES = 3;
        let events = [];

        for (let page = 1; page <= MAX_PAGES; page++) {
          const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/events/public?per_page=100&page=${page}`);
          if (!response.ok) break;

          const pageEvents = await response.json();
          events = events.concat(pageEvents);

          if (pageEvents.length < 100) break;
        }

        return events;
      }

      async fetchRepoCommits(repoName, repoPushes) {
        // Push events arrive newest-first; use the oldest "before" and newest "head"
        // in this window so a single compare call covers the whole push range.
        const sorted = [...repoPushes].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        const oldestEvent = sorted[0];
        const newestEvent = sorted[sorted.length - 1];

        try {
          const response = await fetch(`https://api.github.com/repos/${repoName}/compare/${oldestEvent.payload.before}...${newestEvent.payload.head}`);

          if (!response.ok) {
            throw new Error(`Compare request failed: ${response.status}`);
          }

          const comparison = await response.json();

          return (comparison.commits || []).map(commit => ({
            sha: commit.sha,
            message: commit.commit.message.split('\n')[0],
            repo: repoName,
            timestamp: commit.commit.author?.date || newestEvent.created_at,
            url: commit.html_url
          }));
        } catch (e) {
          console.error(`Error fetching commits for ${repoName}:`, e);
          return [];
        }
      }

      buildCalendarData() {
        this.calendarData = {};

        this.commits.forEach(commit => {
          const date = new Date(commit.timestamp);
          const dateKey = date.toISOString().split('T')[0]; // YYYY-MM-DD

          if (!this.calendarData[dateKey]) {
            this.calendarData[dateKey] = { count: 0, commits: [] };
          }

          this.calendarData[dateKey].count++;
          this.calendarData[dateKey].commits.push(commit);
        });
      }

      renderCalendar() {
        const container = document.getElementById('commitCalendar');
        const today = new Date();

        // Calculate weeks to show (52 weeks)
        const weeks = 52;

        let html = '<div class="calendar-grid">';

        // Month labels - show month with year (e.g., "Apr '26")
        html += '<div class="month-labels">';

        // First, calculate which weeks belong to which months
        const monthRanges = [];
        let currentMonthKey = null;
        let rangeStart = 0;
        let currentLabel = '';

        for (let i = 0; i < weeks; i++) {
          const weekStartDaysAgo = i * 7;
          const weekStart = new Date(today);
          weekStart.setDate(today.getDate() - weekStartDaysAgo);

          const monthYearKey = `${weekStart.getFullYear()}-${weekStart.getMonth()}`;
          const month = weekStart.toLocaleDateString('en-US', { month: 'short' });
          const year = weekStart.getFullYear().toString().slice(-2);
          const monthYear = `${month} '${year}`;

          if (currentMonthKey !== monthYearKey) {
            // Close previous range if exists
            if (currentMonthKey !== null) {
              monthRanges.push({
                start: rangeStart,
                end: i - 1,
                label: currentLabel
              });
            }
            // Start new range
            currentMonthKey = monthYearKey;
            currentLabel = monthYear;
            rangeStart = i;
          }
        }

        // Add the final range
        if (currentMonthKey !== null) {
          monthRanges.push({
            start: rangeStart,
            end: weeks - 1,
            label: currentLabel
          });
        }

        // Now render month labels spanning their respective columns
        monthRanges.forEach((range) => {
          const colStart = range.start + 2; // +2 for day label offset
          const colEnd = range.end + 3; // +3 because grid-column-end is exclusive
          html += `<span style="grid-column: ${colStart} / ${colEnd}; text-align: left;">${range.label}</span>`;
        });

        html += '</div>';

        // Day labels (Mon, Wed, Fri) - positioned relative to today
        const todayDayOfWeek = today.getDay(); // 0 = Sunday, 1 = Monday, etc.
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        for (let day = 0; day < 7; day++) {
          const dayIndex = (todayDayOfWeek - day + 7) % 7; // Going backward from today
          const dayName = dayNames[dayIndex];

          // Only show Mon, Wed, Fri
          if (dayName === 'Mon' || dayName === 'Wed' || dayName === 'Fri') {
            html += `<div class="day-label" style="grid-row: ${day + 2};">${dayName}</div>`;
          }
        }

        // Calendar cells - today at top-left, going backward in time
        for (let week = 0; week < weeks; week++) {
          for (let day = 0; day < 7; day++) {
            const daysAgo = week * 7 + day;
            const currentDate = new Date(today);
            currentDate.setDate(today.getDate() - daysAgo);

            const dateKey = currentDate.toISOString().split('T')[0];
            const data = this.calendarData[dateKey];
            const count = data ? data.count : 0;

            // Determine intensity level (0-4)
            let level = 0;
            if (count > 0) level = 1;
            if (count >= 3) level = 2;
            if (count >= 5) level = 3;
            if (count >= 7) level = 4;

            const col = week + 2; // Offset for day labels
            const row = day + 2; // Offset for month labels

            html += `<div 
              class="calendar-cell level-${level}" 
              data-date="${dateKey}"
              data-count="${count}"
              style="grid-column: ${col}; grid-row: ${row};"
              title="${count} commit${count !== 1 ? 's' : ''} on ${currentDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}"
            ></div>`;
          }
        }

        html += '</div>';
        container.innerHTML = html;
      }

      displayCommits() {
        const container = document.getElementById('commitBoard');

        if (this.commits.length === 0) {
          container.innerHTML = '<div class="no-messages">No recent commits found.</div>';
          return;
        }

        // Group commits by date
        const groupedCommits = {};
        this.commits.forEach(commit => {
          const date = new Date(commit.timestamp);
          const dateKey = date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          if (!groupedCommits[dateKey]) {
            groupedCommits[dateKey] = [];
          }
          groupedCommits[dateKey].push(commit);
        });

        // Render grouped commits
        let html = '';
        Object.keys(groupedCommits).forEach(dateKey => {
          html += `<div class="date-group">
            <h4 class="date-header">${dateKey}</h4>`;

          groupedCommits[dateKey].forEach(commit => {
            html += this.createCommitHTML(commit);
          });

          html += '</div>';
        });

        container.innerHTML = html;
      }

      createCommitHTML(commit) {
        const timestamp = this.formatTimestamp(commit.timestamp);
        const repoLabel = commit.repo.split('/').pop();

        return `
          <div class="commit-card">
            <div class="commit-header">
              <span class="commit-timestamp">${timestamp}</span>
              <span class="commit-char-count">${this.escapeHtml(repoLabel)}</span>
            </div>
            <div class="commit-content">
              <a href="${commit.url}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit;">
                ${this.escapeHtml(commit.message)}
              </a>
            </div>
          </div>
        `;
      }

      formatTimestamp(isoString) {
        const date = new Date(isoString);
        const now = new Date();
        const diffMs = now - date;
        const diffMinutes = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);

        if (diffMinutes < 1) return 'just now';
        if (diffMinutes < 60) return `${diffMinutes}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        if (diffDays < 7) return `${diffDays}d ago`;

        return date.toLocaleTimeString('en-US', {
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        });
      }

      escapeHtml(unsafe) {
        return unsafe
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    }

    // Initialize the git board when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      new GitBoard();
    });
  </script>
